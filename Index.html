<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<script>window.START_FROM="<?!= from ?>";window.KIOSK="<?!= kiosk ?>";</script>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 화면 고정형. 위 제목줄 · 가운데 지도+현재 단계 카드 · 아래 버튼줄. 나머지는 아래에서 올라오는 창. 세로 화면에서는 지도 위, 카드 아래. */
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#15212c; --muted:#5b6b79; --line:#d5dde4;
  --start:#1f9d6b; --route:#1d6fd0; --route-soft:#a9c8ee; --dest:#d9512b; --dest-soft:#fbe1d8;
  --ground:#e4eaee; --bldg:#cfd9e2; --bldg-ink:#2c3d4d; --room:#f8fafc; --corridor:#e9eef2;
  --lobby:#dbe8f6; --field:#b8d9a0; --garden:#cfe6c0; --road:#ffffff; --stair:#b4c2cf;
  --font-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#16202b; --ink:#e6edf3; --muted:#93a3b2; --line:#2a3744;
  --start:#3fc58f; --route:#5aa2ff; --route-soft:#2e4d74; --dest:#ff7a55; --dest-soft:#4a2a22;
  --ground:#121b24; --bldg:#2a3a4b; --bldg-ink:#d6e1ea; --room:#1c2834; --corridor:#141e28;
  --lobby:#1f3550; --field:#2d4728; --garden:#263d2c; --road:#253140; --stair:#3d4e60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#16202b; --ink:#e6edf3; --muted:#93a3b2; --line:#2a3744;
  --start:#3fc58f; --route:#5aa2ff; --route-soft:#2e4d74; --dest:#ff7a55; --dest-soft:#4a2a22;
  --ground:#121b24; --bldg:#2a3a4b; --bldg-ink:#d6e1ea; --room:#1c2834; --corridor:#141e28;
  --lobby:#1f3550; --field:#2d4728; --garden:#263d2c; --road:#253140; --stair:#3d4e60; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
img{max-width:100%}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;width:100%;padding:10px 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--route);outline-offset:2px}

/* 앱 틀 */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding-block:10px max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;min-width:0}
.bar h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.01em;white-space:nowrap}
.trip{min-width:0;flex:1;display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden}
.trip b{color:var(--ink);font-size:16px;overflow:hidden;text-overflow:ellipsis}
.trip #destSub{overflow:hidden;text-overflow:ellipsis}
.trip .arr{color:var(--route);font-weight:700}

.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:12px;min-height:0}
@media (max-width:760px),(max-aspect-ratio:4/5){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(130px,1fr) auto}
  .card .cphotos{flex:none;height:clamp(120px,26vh,300px)}
  .card .cphotos:empty{display:none}
  .bar h1{font-size:18px}
  .trip{flex-basis:100%;font-size:13px}
}
@media (max-width:760px){
  .app{gap:8px;padding-top:8px}
  .bar{flex-wrap:nowrap;gap:10px;align-items:center}
  .bar h1{font-size:15px}
  .trip{flex-basis:auto;font-size:12.5px}
  .trip b{font-size:14px}
  .card .cctl{display:none}
  .card .cmini{display:flex}
  .cnav button{min-height:40px}
}

/* 지도 */
.nav{position:relative;min-height:0;background:var(--ground);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nav svg{display:block;width:100%;height:100%}
#scene{transition:opacity .5s ease}
.chip{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--route);display:inline-block}
.ladder{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.ladder b{font-family:var(--font-display);font-weight:400;font-size:14px;width:34px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:background .2s,color .2s}
.ladder b.on{background:var(--route);border-color:var(--route);color:#fff}
.stairs-pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stairs-pop div{font-family:var(--font-display);font-size:clamp(32px,6vw,60px);color:var(--route);background:var(--panel);border:2px solid var(--route);border-radius:16px;padding:6px 22px;opacity:.96}
.note-map{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:var(--panel);border-radius:6px;padding:1px 8px;opacity:.9}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ground);color:var(--muted);font-weight:600;z-index:3}

/* 현재 단계 카드 */
.card{min-height:0;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--lobby);border-radius:10px;padding:8px 10px;font-size:13.5px}
.tstrip b{font-size:14.5px}
.tstrip span{color:var(--muted)}
.tstrip button{margin-left:auto;border:1px solid var(--route);background:var(--panel);color:var(--route);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.chead{display:flex;align-items:center;gap:10px}
.cnum{flex:none;font-weight:700;font-size:13px;color:#fff;background:var(--route);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.cnum.end{background:var(--dest)}
.cwhere{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cmini{display:none;gap:6px;flex:none}
.cmini button{width:38px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.cmini #playMini{background:var(--route);border-color:var(--route);color:#fff;font-size:12px}
.welcome{color:var(--muted);font-size:15px;margin:0}
.welcome-go{border:0;background:var(--ink);color:var(--panel);border-radius:12px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;min-height:52px}
.ctext{margin:0;font-size:clamp(17px,1.7vw,23px);font-weight:600;line-height:1.42;text-wrap:pretty;word-break:keep-all}
.cphotos{flex:1;min-height:0;display:flex;gap:8px}
.cphotos figure{flex:1;min-width:0;min-height:0;margin:0;display:flex;flex-direction:column;gap:3px}
.cphotos img{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:10px;background:var(--corridor)}
.cphotos figcaption{font-size:12px;color:var(--muted)}
.cprog{height:4px;border-radius:2px;background:var(--corridor);overflow:hidden;flex:none}
.cprog i{display:block;height:100%;width:0;background:var(--route)}
.cnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;flex:none}
.cnav button,.cctl button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:44px;white-space:nowrap}
.cnav button:disabled{opacity:.35;cursor:default}
.cnav #next.wait{background:var(--route);border-color:var(--route);color:#fff}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.cnav .dots button{width:11px;height:11px;min-height:0;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer;flex:none}
body.kiosk .cnav .dots button{min-height:0;width:14px;height:14px;padding:0}
.cnav .dots button.done{background:var(--route-soft)}
.cnav .dots button.now{background:var(--route);transform:scale(1.25)}
.cnav .dots button.end{background:var(--dest-soft)}
.cnav .dots button.end.now{background:var(--dest)}
.cctl{display:flex;gap:8px;flex:none}
.cctl button{flex:1;padding:8px 10px;min-height:40px;font-size:13.5px}
.cctl #play{background:var(--route);border-color:var(--route);color:#fff}

/* 아래 버튼줄 */
.dock{display:grid;grid-template-columns:1.5fr repeat(4,minmax(0,1fr));gap:8px}
.dock button{min-height:52px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;padding:6px;word-break:keep-all;line-height:1.25}
.dock button.main{background:var(--ink);border-color:var(--ink);color:var(--panel);font-size:16px}
.dock button:active{transform:translateY(1px)}
@media (max-width:760px){.note-map{display:none}.dots{gap:5px}.cnav .dots button{width:9px;height:9px}.dock{gap:6px}.dock button{min-height:48px;font-size:13px;padding:4px}.dock button.main{font-size:14px}
  .card{padding:12px;gap:8px}.cnav button{padding:8px 10px}.cctl button{min-height:36px}}
@media (max-height:520px) and (orientation:landscape){.app{gap:6px;padding-block:6px}.dock button{min-height:40px}.bar h1{font-size:17px}.cctl{display:none}}

/* 키오스크 */
body.kiosk{font-size:17px}
body.kiosk .ctext{font-size:clamp(20px,2.1vw,30px)}
body.kiosk .dock button{min-height:68px;font-size:18px}
body.kiosk .cnav button{min-height:56px;font-size:17px}

/* 올라오는 창 */
.sheet{position:fixed;inset:0;z-index:50}
.spanel:focus{outline:none}
.scrim{position:absolute;inset:0;background:rgba(8,16,24,.48)}
.spanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 32px));max-height:88vh;max-height:88dvh;
  display:flex;flex-direction:column;background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
@media (max-width:760px){.spanel{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.shead{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:8px 8px 0 12px}
.stabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.stabs button{border:0;background:none;padding:10px 12px 12px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--route)}
.sclose{flex:none;width:40px;height:40px;border:0;background:var(--bg);border-radius:50%;font-size:17px;cursor:pointer;margin-bottom:6px}
.sbody{overflow:auto;padding:16px;min-height:0;overscroll-behavior:contain}
.sbody h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.04em}
.pane{display:flex;flex-direction:column;gap:14px}
.search{position:relative}
.results{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;list-style:none;margin:0;padding:4px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.results li{padding:10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.results li small{color:var(--muted);white-space:nowrap}
.results li[aria-selected="true"],.results li:hover{background:var(--lobby)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips button:hover{border-color:var(--route);color:var(--route)}
.tfind form{display:flex;gap:8px}
.tfind input{flex:1;min-width:0}
.tfind form button,.tbtns button{font-size:14.5px;font-weight:600;border-radius:10px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.tfind form button{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tbtns button.primary{background:var(--route);border-color:var(--route);color:#fff}
.tmsg{font-size:13px;color:var(--muted);margin:0}
.tmsg.warn{color:var(--dest)}
.tcard{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.tinfo{font-size:13px;color:var(--muted)}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.kbtoggle{align-self:flex-start;font-size:13px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
.kbd{padding:8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.kbrow{display:grid;gap:5px;grid-template-columns:repeat(10,minmax(0,1fr))}
.kbrow.r1{grid-template-columns:repeat(9,minmax(0,1fr));padding-inline:calc((100% - 45px)/20)}
.kbrow.r2{grid-template-columns:1.5fr repeat(7,minmax(0,1fr)) 1.5fr}
.kbrow.r3{grid-template-columns:1.3fr 2fr 1.3fr}
.kbd button{font-size:clamp(16px,4.6vw,21px);min-height:46px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;box-shadow:0 1px 0 var(--line)}
body.kiosk .kbd button{min-height:58px}
.kbd button:active{background:var(--lobby)}
.kbd button.fn{font-size:14px;background:var(--corridor)}
.kbd button.fn.on{background:var(--route);color:#fff;border-color:var(--route)}
.kbd button.go{background:var(--route);color:#fff;border-color:var(--route);font-weight:700}
.tfind input[readonly]{background:var(--panel);border-color:var(--route)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{position:relative;overflow:hidden;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:background .2s,opacity .2s}
ol.steps li .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
ol.steps li .where{font-size:12px;color:var(--muted)}
ol.steps li.done{opacity:.55}
ol.steps li.done .n{background:var(--route-soft);border-color:var(--route-soft);color:var(--ink)}
ol.steps li.now{background:var(--lobby)}
ol.steps li.now .n{background:var(--route);border-color:var(--route);color:#fff}
ol.steps li.arrive .n{border-color:var(--dest);color:var(--dest)}
ol.steps li.arrive.now .n{background:var(--dest);color:#fff}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#overview{display:block;width:100%;height:auto;max-height:68vh;background:var(--ground);border-radius:12px}
.speed{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.speed button{font-size:13px;line-height:1.25;border:0;border-radius:7px;padding:9px 2px;background:transparent;color:var(--muted);cursor:pointer;word-break:keep-all}
.speed button[aria-checked="true"]{background:var(--route);color:#fff;font-weight:600}
.stepmode{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14.5px;font-weight:600;cursor:pointer}
.stepmode input{width:20px;height:20px;margin:0;accent-color:var(--route)}
.stepmode small{flex-basis:100%;font-weight:400;color:var(--muted);font-size:13px;padding-left:28px}
.foot{font-size:12.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){#scene{transition:none}.cnav .dots button.now{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>순천청암고 길안내</h1>
    <div class="trip"><span id="tripFrom">정문</span><span class="arr">→</span><b id="destName"></b><span id="destSub"></span></div>
  </header>

  <main class="stage">
    <section class="nav" aria-label="동선 화면">
    <svg id="map" viewBox="-50 -95 700 595" preserveAspectRatio="xMidYMid meet" role="img" aria-label="길안내 지도">
      <defs>
        <pattern id="stairPat" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="var(--stair)"/><rect width="8" height="3" fill="var(--bldg)"/></pattern>
      </defs>
      <g id="scene"></g>
      <g id="trail"></g>
      <g id="marker"><circle r="15" fill="var(--route)" opacity=".18"><animate attributeName="r" values="12;20;12" dur="1.6s" repeatCount="indefinite"/></circle><circle r="10" fill="var(--route)" stroke="#fff" stroke-width="3"><animate attributeName="opacity" values="1;.35;1" dur="1.1s" repeatCount="indefinite"/></circle><path id="arrow" d="M-4 4 L0 -5 L4 4 Z" fill="#fff"/></g>
    </svg>
      <div class="chip"><i></i><span id="where">캠퍼스</span></div>
      <div class="ladder" id="ladder" hidden></div>
      <div class="stairs-pop" id="stairsPop" hidden><div id="stairsTxt"></div></div>
      <div class="loading" id="loading">안내도를 불러오는 중이에요…</div>
      <div class="note-map" id="noteMap">도식 안내도 · 실제와 조금 다를 수 있어요</div>
    </section>

    <section class="card" aria-label="지금 단계">
      <div class="tstrip" id="tstrip" hidden></div>
      <div class="chead"><span class="cnum" id="cNum"></span><span class="cwhere" id="cWhere"></span><span class="cmini"><button type="button" id="playMini" aria-label="일시정지">❚❚</button><button type="button" id="replayMini" aria-label="처음부터">↺</button></span></div>
      <p class="ctext" id="cText" aria-live="polite"></p>
      <div class="cphotos" id="cPhotos"></div>
      <div class="cprog"><i id="cProg"></i></div>
      <div class="cnav">
        <button type="button" id="prev">◀ 이전</button>
        <div class="dots" id="dots" role="tablist" aria-label="단계"></div>
        <button type="button" id="next">다음 ▶</button>
      </div>
      <div class="cctl">
        <button type="button" id="play">일시정지</button>
        <button type="button" id="replay">처음부터</button>
      </div>
    </section>
  </main>

  <nav class="dock" aria-label="메뉴">
    <button type="button" class="main" data-open="dest">어디로 가세요?</button>
    <button type="button" data-open="teacher">선생님 찾기</button>
    <button type="button" data-open="steps">전체 단계</button>
    <button type="button" data-open="map">전체 지도</button>
    <button type="button" data-open="settings">설정</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="spanel" role="dialog" aria-modal="true" aria-label="메뉴" tabindex="-1">
    <div class="shead">
      <div class="stabs" role="tablist">
        <button type="button" role="tab" data-tab="dest">목적지</button>
        <button type="button" role="tab" data-tab="teacher">선생님 찾기</button>
        <button type="button" role="tab" data-tab="steps">전체 단계</button>
        <button type="button" role="tab" data-tab="map">전체 지도</button>
        <button type="button" role="tab" data-tab="settings">설정</button>
      </div>
      <button type="button" class="sclose" data-close aria-label="닫기">✕</button>
    </div>
    <div class="sbody">
      <section class="pane" data-pane="dest">

<script>
const NS="http://www.w3.org/2000/svg";

/* ── 건물 구조 (고정). 방 이름과 순서는 시트 '방 목록'에서 받아옴 ── */
const BUILDING_KEYS={'본관':'main','별관':'annex','실습동':'lab','드림홀':'dream','청죽원':'bamboo','청암체육관':'gym','청암관':'cheongam'};
const STAIRS={main:'three',annex:'three',lab:'one',dream:'one',bamboo:'one',gym:'none',cheongam:'one'};
const UNIV={cheongam:true}; // 청암대 건물

/* ── 학교 안 길 (정문은 동쪽, 위쪽이 북쪽) ── */
const NODES={G:[592,300],GJ:[520,300],J:[487,300],PK:[380,300],MF:[285,300],DW:[52,300],ME:[285,279],
  E1:[487,232],BB:[503,232],E2:[487,198],AJ:[285,198],AE:[285,171],DJ:[52,198],DE:[52,190],
  E3:[487,103],LJ:[300,103],LE:[300,86],MB:[285,230],AB:[300,122],NW:[150,103],DB:[52,120],
  CW:[150,-4],CA:[300,-4],CE:[487,-4],LB:[300,40],GY:[520,390]};
const EDGES=[['G','GJ'],['GJ','J'],['J','PK'],['PK','MF'],['MF','DW'],['MF','ME'],['GJ','GY'],
  ['J','E1'],['E1','BB'],['E1','E2'],['E2','E3'],['E2','AJ'],['AJ','AE'],['AJ','MB'],['AJ','DJ'],['DW','DJ'],['DJ','DE'],
  ['E3','LJ'],['LJ','LE'],['LJ','AB'],['LJ','NW'],['NW','DB',[[52,103]]],
  ['NW','CW'],['CW','CA'],['CA','CE'],['CE','E3'],['CA','LB']];
const LAND={G:'정문',GJ:'체육관 갈림길',J:'청죽원 쪽 길 입구',PK:'본관앞 주차장',MF:'본관 앞 큰 계단 아래',DW:'본관 서쪽 끝',
  E1:'청죽원 앞',E2:'정원 옆 큰길',AJ:'별관 현관 앞',DJ:'드림홀 앞',E3:'별관 뒤 갈림길',LJ:'실습동 현관 앞',NW:'실습동 서쪽 끝',
  CW:'청암관 앞 서쪽 길',CE:'청암관 앞 동쪽 길'};
const ENTRY={main:['ME','MB'],annex:['AE','AB'],lab:['LE','LB'],dream:['DE','DB'],bamboo:['BB'],gym:['GY'],cheongam:['CA']};
const ENTRY_NAME={ME:'본관 현관',MB:'본관 뒷문',AB:'별관 뒷문',AE:'별관 현관',LE:'실습동 현관',LB:'실습동 뒷문',DE:'드림홀 입구',DB:'드림홀 뒤쪽 입구',
  BB:'청죽원 입구',GY:'청암체육관 입구',CA:'청암관 입구'};
const SPECIAL={'MF>ME':'큰 계단을 올라 본관 현관으로 들어가요.','ME>MF':'큰 계단을 내려가요.',
  'AJ>MB':'정원 사이 길로 곧장 내려가 본관 뒷문으로 들어가요.','MB>AJ':'정원 사이 길로 곧장 올라가요.'};
const SPECIAL_RUN={'AB>LE':'통로를 건너 바로 맞은편 실습동 현관으로 들어가요.','LE>AB':'통로를 건너 바로 맞은편 별관 뒷문으로 들어가요.'};
const STARTS=[{id:'gate',node:'G',label:'정문'},{id:'main',node:'ME',nodes:['ME','MB'],label:'본관 현관'},{id:'annex',node:'AE',nodes:['AE','AB'],label:'별관 현관'},
  {id:'lab',node:'LE',nodes:['LE','LB'],label:'실습동 현관'},{id:'parking',node:'PK',label:'본관앞 주차장'}];
let START='gate', lastEntry=null, lastFrom=null;
const startObj=()=>STARTS.find(s=>s.id===START)||STARTS[0];
const startNode=()=>startObj().node;
const startNodes=()=>startObj().nodes||[startObj().node];
const ADJ={};
EDGES.forEach(([a,b,via])=>{const pts=[NODES[a],...(via||[]),NODES[b]];
  (ADJ[a]=ADJ[a]||[]).push({to:b,pts}); (ADJ[b]=ADJ[b]||[]).push({to:a,pts:pts.slice().reverse()});});
function shortest(from,to){
  const dist={},prev={},left=new Set(Object.keys(NODES)); for(const n in NODES) dist[n]=Infinity; dist[from]=0;
  while(left.size){ let u=null; for(const n of left) if(u===null||dist[n]<dist[u]) u=n;
    left.delete(u); if(u===to||dist[u]===Infinity) break;
    for(const e of ADJ[u]||[]){ const d=dist[u]+len(e.pts); if(d<dist[e.to]){dist[e.to]=d;prev[e.to]={from:u,e}} } }
  const path=[]; let n=to; while(n!==from){ const p=prev[n]; if(!p) return []; path.unshift({from:p.from,to:n,pts:p.e.pts}); n=p.from; }
  return path;
}
function ro(w){const c=String(w).slice(-1).charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3){const j=(c-0xAC00)%28; return w+(j&&j!==8?'으로':'로')} return w+'로'}
function turnOf(a,b){ // a: 들어오는 마지막 구간, b: 나가는 첫 구간
  const v1=[a[1][0]-a[0][0],a[1][1]-a[0][1]], v2=[b[1][0]-b[0][0],b[1][1]-b[0][1]];
  const cr=v1[0]*v2[1]-v1[1]*v2[0], dot=v1[0]*v2[0]+v1[1]*v2[1];
  if(Math.abs(cr)<1e-6&&dot>0) return 'S'; return cr>0?'R':'L';
}
function campusSteps(destB){
  const froms=startNodes(), ends=ENTRY[destB];
  let path=null, entry=ends[0], from=froms[0];
  const same=froms.find(f=>ends.includes(f));
  if(same){ path=[]; entry=same; from=same; }
  else froms.forEach(f=>ends.forEach(t=>{ const pp=shortest(f,t); const L=pp.reduce((s,e)=>s+len(e.pts),0);
    if(pp.length&&(!path||L<path.L)){ path=pp; path.L=L; entry=t; from=f; } }));
  path=path||[]; lastFrom=from;
  // 곧게 이어지는 구간은 하나로 묶기
  let runs=[];
  path.forEach((e,i)=>{
    const key=e.from+'>'+e.to, last=runs[runs.length-1];
    const prevE=path[i-1];
    const turn=prevE?turnOf(prevE.pts.slice(-2),e.pts.slice(0,2)):null;
    if(last&&!last.special&&!SPECIAL[key]&&turn==='S'&&!ENTRY_NAME[e.from]) { last.to=e.to; last.pts=last.pts.concat(e.pts.slice(1)); }
    else runs.push({from:e.from,to:e.to,pts:e.pts.slice(),turn,special:SPECIAL[key]||null});
  });
  // 건물에서 나와 몇 걸음 뒤 바로 꺾는 짧은 구간은 다음 단계에 합침
  let lead=null;
  if(runs.length>1&&!runs[0].special&&len(runs[0].pts)<40){ lead=runs[0]; runs=runs.slice(1); runs[0].pts=lead.pts.concat(runs[0].pts.slice(1)); }
  let gardenShown=false;
  const out=runs.map((r,i)=>{
    let pre='';
    const tw=r.turn==='R'?'오른쪽으로 꺾어 ':r.turn==='L'?'왼쪽으로 꺾어 ':'';
    if(i===0) pre= from==='G'?'정문으로 들어와 ':from==='PK'?'본관앞 주차장에서 ':from==='MB'&&START==='main'?'본관 현관에서 건물 안을 지나 반대편 뒷문으로 나와 '+(lead?tw:''):from==='AB'&&START==='annex'?'별관 현관에서 건물 안을 지나 반대편 뒷문으로 나와 '+(lead?tw:''):from==='LB'&&START==='lab'?'실습동 현관에서 건물 안을 지나 뒷문으로 나와 '+(lead?tw:''):ENTRY_NAME[from]+'에서 나와 '+(lead?tw:'');
    else pre= tw||'계속 직진해서 ';
    let t;
    if(r.special) t=pre+r.special;
    else if(SPECIAL_RUN[r.from+'>'+r.to]) t=pre+SPECIAL_RUN[r.from+'>'+r.to];
    else if(ENTRY_NAME[r.to]) t=pre+ro(ENTRY_NAME[r.to])+' 들어가요.';
    else t=pre+LAND[r.to]+'까지 가요.';
    if(r.pts.every(p=>p[1]===300)&&len(r.pts)>=150){
      const west=r.pts[r.pts.length-1][0]<r.pts[0][0];
      t+= west?' 오른쪽에 본관, 왼쪽에 축구장이 보여요.':' 왼쪽에 본관, 오른쪽에 축구장이 보여요.';
    }
    if(r.to==='CA'||(r.to==='CW'||r.to==='CE')) t+=' 청암관은 청암대학교 건물이에요.';
    const photos=[];
    if(i===0) photos.push(from==='G'?'정문':from==='PK'?'본관앞 주차장':ENTRY_NAME[from]);
    if(!gardenShown&&r.pts.some((q,j)=>j>0&&q[1]===198&&r.pts[j-1][1]===198)){ photos.push('청빈원(정원) 길'); gardenShown=true; }
    if(ENTRY_NAME[r.to]) photos.push(ENTRY_NAME[r.to]);
    return {scene:'campus',where:'학교 안 길',text:t,pts:r.pts,photos};
  });
  // 청암관 안내 문장은 한 번만
  let seen=false; out.forEach(s=>{ if(s.text.includes(' 청암관은 청암대학교')){ if(seen) s.text=s.text.replace(' 청암관은 청암대학교 건물이에요.',''); seen=true; } });
  out.entry=entry;
  return out;
}
const BOX={lab:[150,40,300,44],annex:[115,122,350,46],main:[80,228,390,48],dream:[25,120,55,70],bamboo:[503,195,62,70],gym:[455,392,120,100],cheongam:[160,-80,280,64]};
const BNAME={main:'본관',annex:'별관',lab:'실습동',dream:'드림홀',bamboo:'청죽원',gym:'청암체육관',cheongam:'청암관'};
const INFO_SCI=[8,334,84,132]; // 청암대 정보과학관 (길안내 대상 아님)

const ROW_TOP=64, ROW_BOT=168, COR_Y=197, SOUTH=270;
let B={}, GEO={}, DEST=[], ROUTE_PHOTOS={};
const fname=f=>f<0?'지하 '+(-f)+'층':f+'층';
const fshort=f=>f<0?'B'+(-f):f+'F';
const norm=s=>String(s).replace(/[\s()·\-,]/g,'').toLowerCase();

/* 시트 행 → 건물·층·방 구조 */
function buildModel(data){
  B={}; GEO={}; DEST=[]; ROUTE_PHOTOS=data.routePhotos||{};
  for(const k in BNAME) B[k]={name:BNAME[k],stairs:STAIRS[k],floors:[]};
  const tmp={};
  (data.rooms||[]).forEach(r=>{
    const k=BUILDING_KEYS[String(r.building).trim()]; if(!k) return;
    const f=Number(r.floor); if(!f) return;
    (tmp[k]=tmp[k]||{})[f]=(tmp[k][f]||[]);
    tmp[k][f].push({order:Number(r.order)||0,lobby:String(r.kind).trim()==='현관',name:String(r.name).trim(),alias:String(r.alias||''),photo:String(r.photo||'').trim()});
  });
  for(const k in B){
    const fl=tmp[k]||{};
    B[k].floors=Object.keys(fl).map(Number).sort((a,b)=>a-b).map(f=>[f,fl[f].sort((a,b)=>a.order-b.order)]);
    if(!B[k].floors.some(x=>x[0]===1)) B[k].floors.unshift([1,[]]);
  }
  for(const k in B){
    const fl=B[k].floors, max=Math.max(1,...fl.map(f=>f[1].length));
    const width=Math.max(max*118,420), xs={};
    fl.forEach(([f,rooms])=>{const s=width/Math.max(rooms.length,1);xs[f]=rooms.map((_,i)=>(i+.5)*s)});
    const first=fl.find(f=>f[0]===1)[1], li=first.findIndex(r=>r.lobby);
    const hx= li>=0 ? xs[1][li] : width*0.3;
    const cx= Math.min(hx+(li>=0?78:120), width-40);
    GEO[k]={width,xs,hx,cx};
  }
  for(const k in B) for(const [f,rooms] of B[k].floors) rooms.forEach((r,i)=>{
    if(r.lobby||!r.name) return;
    DEST.push({id:DEST.length,b:k,f,i,name:r.name,alias:r.alias,photo:r.photo,
      where:B[k].name+(UNIV[k]?'(청암대)':'')+(B[k].floors.length>1||f!==1?' '+fname(f):'')});
  });
}

/* ── 경로 생성 ── */
function floorRooms(k,f){return B[k].floors.find(x=>x[0]===f)[1]}
function nthFrom(k,f,fromX,toX){
  const rooms=floorRooms(k,f), xs=GEO[k].xs[f]; let n=0;
  rooms.forEach((r,i)=>{ if(r.lobby)return; const x=xs[i];
    if(toX>=fromX? (x>fromX&&x<=toX+1):(x<fromX&&x>=toX-1)) n++; });
  return n;
}
function iyeyo(w){ // 받침에 따라 '이에요' / '예요'
  const s=String(w).replace(/[^0-9A-Za-z\uAC00-\uD7A3]+$/,''); const ch=s.slice(-1), c=ch.charCodeAt(0);
  if(c>=0xAC00&&c<=0xD7A3) return w+((c-0xAC00)%28?'이에요':'예요');
  if(/[0-9]/.test(ch)) return w+('013678'.includes(ch)?'이에요':'예요');
  return w+'이에요';
}
function ord(n){return n===1?'첫 번째':n===2?'두 번째':n===3?'세 번째':n===4?'네 번째':n+'번째'}
function buildSteps(d,teacher){
  const g=GEO[d.b], bn=B[d.b].name, small=B[d.b].floors.every(f=>f[1].length<=1);
  const S=campusSteps(d.b), onSite=S.length===0, entry=S.entry; lastEntry=entry;
  const rx=g.xs[d.f][d.i], door=[rx,ROW_BOT+2], start=(entry==='MB'||entry==='AB'||entry==='LB')?[g.hx,ROW_TOP-22]:[g.hx,SOUTH+22];
  const k1=d.b+':1', kf=d.b+':'+d.f;
  if(d.b==='gym'){ S.push({scene:'campus',where:'청암체육관',text:'도착했어요. 이곳이 청암체육관이에요.',pts:[[520,390]],arrive:true,room:d.photo}); return S;}
  const n0=S.length;
  if(d.f===1){
    let t;
    if(small) t='입구로 들어오면 바로 '+iyeyo(d.name)+'.';
    else{const left=rx<g.hx, n=nthFrom(d.b,1,g.hx,rx);
      t='현관으로 들어와 '+(left?'왼쪽':'오른쪽')+'으로 가요. '+(n===1?'바로 옆':ord(n))+' 방이 '+iyeyo(d.name)+'.';}
    S.push({scene:k1,where:bn+' 1층',text:t,pts:[start,[g.hx,COR_Y],[rx,COR_Y],door]});
  }else{
    const stairName=B[d.b].stairs==='three'?bn+' 중앙 계단':bn+' 계단';
    S.push({scene:k1,where:bn+' 1층',text:(small?'입구로 들어와 계단으로 가요.':B[d.b].stairs==='three'?'현관으로 들어와 현관 앞 중앙 계단으로 가요.':'현관으로 들어와 현관 옆 계단으로 가요.'),pts:[start,[g.hx,COR_Y],[g.cx,COR_Y],[g.cx,SOUTH-26]],photos:[stairName]});
    S.push({scene:kf,where:'계단',text:'계단으로 '+fname(d.f)+'까지 '+(d.f>1?'올라':'내려')+'가요.',pts:[[g.cx,SOUTH-26]],stairs:[1,d.f]});
    let t;
    if(small) t='계단에서 나오면 바로 '+iyeyo(d.name)+'.';
    else{const west=rx<g.cx, n=nthFrom(d.b,d.f,g.cx,rx);
      const dir=(d.b==='main'||d.b==='annex')?(west?'드림홀 쪽(서쪽)':'청죽원 쪽(동쪽)'):(west?'왼쪽(서쪽)':'오른쪽(동쪽)');
      t='계단에서 나와 '+dir+' 복도로 가요. '+(n===1?'바로 앞':ord(n))+' 방이 '+iyeyo(d.name)+'.';}
    S.push({scene:kf,where:bn+' '+fname(d.f),text:t,pts:[[g.cx,SOUTH-26],[g.cx,COR_Y],[rx,COR_Y],door]});
  }
  if(onSite&&S[n0]) S[n0].text=S[n0].text.replace('현관으로 들어와 현관 ','현관 ').replace('현관으로 들어와 ','현관에서 ').replace('입구로 들어와 ','입구에서 ').replace('입구로 들어오면 ','입구에서 ');
  if(entry==='AB'&&S[n0]) S[n0].text=S[n0].text.replace('현관으로 들어와 현관 앞 중앙 계단','뒷문으로 들어와 바로 앞 중앙 계단').replace('현관으로 들어와 ','뒷문으로 들어와 ');

/* ── 교무실 자리 배치 (2026-10-21 교무실 배치도 기준, 그림 왼쪽이 동편) ──
   묶음마다: panels(천장 판넬, 왼쪽 줄·오른쪽 줄 순서), head(맨 앞 자리 위치), L/R(줄별 자리 수) 또는 C(한 줄 자리 수) */
const SEATMAP={
  '제1교무실':[{panels:['교무기획부'],head:'C',L:3,R:3},{panels:['학생복지부','교육연구부'],head:'R',L:3,R:3},{panels:['학생생활안전부'],head:'C',L:3,R:3}],
  '제2교무실':[{panels:['교육활동홍보부','디자인·라케부'],L:3,R:3},{panels:['디자인·라케부','보건간호부'],L:3,R:3},{panels:['학과지원부','특성화교육부'],L:3,R:3},{panels:['특성화교육부'],C:2}],
  '제3교무실':[{panels:['2학년부'],C:2},{panels:['1학년부','사업기획부'],L:3,R:3},{panels:['사업기획부'],C:3}],
  '제4교무실':[{panels:['3학년부'],L:2,R:2},{panels:['취업부'],L:2,R:3}],
  '행정실':[{panels:['행정실'],L:3,R:3}]
};
const CW=116, CH=40, GAP=64, PANEL_H=28;
function seatLayout(office){
  const isl=SEATMAP[office]; if(!isl) return null;
  const cells=[], panels=[]; let x=0;
  isl.forEach((I,ii)=>{
    const cols=I.C?['한 줄']:['왼쪽','오른쪽'], w=cols.length*CW;
    if(I.panels.length===1) panels.push({x,w,label:I.panels[0]});
    else I.panels.forEach((lb,j)=>panels.push({x:x+j*CW,w:CW,label:lb}));
    const top=PANEL_H+10+(I.head?CH+10:0);
    if(I.head) cells.push({isl:ii+1,col:'맨 앞',n:0,x:I.head==='C'?x+(w-CW)/2:x+CW,y:PANEL_H+10});
    cols.forEach((c,j)=>{const cnt=I.C||(c==='왼쪽'?I.L:I.R);
      for(let n=1;n<=cnt;n++) cells.push({isl:ii+1,col:c,n,x:x+j*CW,y:top+(n-1)*CH});});
    x+=w+GAP;
  });
  const width=x-GAP, height=Math.max(...cells.map(c=>c.y+CH));
  return {cells,panels,width,height};
}
function seatInfo(tc){
  const L=seatLayout(tc.place); if(!L) return null;
  const isl=Number(tc.island), col=String(tc.col||'').trim(), n=Number(tc.order)||0;
  const cell=L.cells.find(c=>c.isl===isl&&c.col===col&&(col==='맨 앞'||c.n===n)); if(!cell) return null;
  const I=SEATMAP[tc.place][isl-1];
  let text;
  if(col==='맨 앞') text=(I.head==='R'?I.panels[I.panels.length-1]:I.panels[0])+' 판넬 바로 아래, 맨 앞 '+(I.head==='C'?'가운데 ':'')+'자리';
  else if(col==='한 줄') text=I.panels[0]+' 판넬 아래 한 줄 책상, 앞에서 '+ord(n)+' 자리';
  else if(I.panels.length>1) text=(col==='왼쪽'?I.panels[0]:I.panels[1])+' 판넬 쪽 책상 묶음의 '+col+' 줄, 앞에서 '+ord(n)+' 자리';
  else text=I.panels[0]+' 판넬 아래 책상 묶음의 '+col+' 줄, 앞에서 '+ord(n)+' 자리';
  return {text,cell,pt:[cell.x+CW/2,cell.y+6]};
}

    polyline([...s.pts.slice(0,a.idx),pos],{stroke:'var(--route)','stroke-width':6}); }
  else{ const prev=[...steps.slice(0,cur)].reverse().find(x=>x.pts.length>1&&x.scene===s.scene); if(prev){const a=along(prev.pts,1);ang=a.ang} }
  // 목적지 핀

  marker.style.display=s.arrive&&t>.5?'none':'';
  // 카메라
  let vb;
  const narrow=svg.clientWidth&&svg.clientWidth<520;
  if(s.scene==='campus'){
    if(narrow){ // 좁은 화면: 화살표 주변을 크게 보여줌
      const VW=380, VH=VW*5/6; vb=[Math.max(-10,Math.min(pos[0]-VW/2,628-VW)),Math.max(-95,Math.min(pos[1]-VH/2,500-VH)),VW,VH];
    } else vb=[-50,-95,700,595];
  }
  else if(s.scene.startsWith('seat:')){ const L=seatLayout(s.scene.slice(5)), W=L.width+80, H=L.height+110;
    if(narrow&&W>420){ // 좁은 화면: 찾는 자리 주변을 크게
      const VW=Math.max(380,H*1.2), VH=VW/1.2, cx=s.pts[0][0];
      vb=[Math.max(-40,Math.min(cx-VW/2,L.width+40-VW)),-62-(VH-H)/2,VW,VH];
    } else { const VW=Math.max(W,H*1.2), VH=VW/1.2; vb=[-40-(VW-W)/2,-62-(VH-H)/2,VW,VH]; } }
  else{ const k=s.scene.split(':')[0], W=GEO[k].width, VW=Math.min(W+60,520), VH=VW*5/6;
    const x=Math.max(-30,Math.min(pos[0]-VW/2,W+30-VW)); vb=[x,(ROW_TOP+SOUTH)/2+8-VH/2,VW,VH]; }
  if(!cam||reduce) cam=vb.slice(); else cam=cam.map((v,i)=>v+(vb[i]-v)*.06);
  svg.setAttribute('viewBox',cam.map(v=>v.toFixed(1)).join(' '));
  // 계단 연출
  if(s.stairs){ const [a,b]=s.stairs, total=Math.abs(b-a)||1, dirn=Math.sign(b-a);
    let k=Math.min(total,Math.floor(t*(total+1))), fl=a+dirn*k;     if(b===-1) fl=t<.5?1:-1;
    $('stairsPop').hidden=t>=.98; $('stairsTxt').textContent=fshort(a)+'  →  '+fshort(b); litFloor(fl);
  } else $('stairsPop').hidden=true;
  // 목록 상태
  const dd=duration(s), H=cur===steps.length-1?0:HOLD;
  const p=waiting?1:(hold>0?(dd+H-hold)/(dd+H):(t*dd)/(dd+H||1));
  const key=steps.length+':'+cur+':'+(dest&&dest.id);

function tick(ts){
  const dt=lastTs?Math.min((ts-lastTs)/1000,.05):0; lastTs=ts;

    if(hold>0){ hold-=dt*speedMul; if(hold<=0){ hold=0; if(cur<steps.length-1){ if(stepMode){playing=false;waiting=true;updatePlay()} else {cur++;t=0;scrollStep()} } else {playing=false;updatePlay()} } }
    else{ t+=dt*speedMul/(reduce?.01:duration(steps[cur])); if(t>=1){t=1;hold=cur===steps.length-1?0.01:(reduce?1.5:HOLD);} }

  if(!DEST.length){ $('destName').textContent='방 목록이 비어 있어요'; $('destSub').textContent='시트의 방 목록 탭을 확인해 주세요.'; return; }
  setupPicker();
  showWelcome();
  requestAnimationFrame(tick);
  openSheet('dest');
}
function fail(err){
  $('loading').hidden=true;
  $('destName').textContent='안내도를 불러오지 못했어요';
  $('destSub').textContent='잠시 후 새로고침해 주세요. ('+(err&&err.message?err.message:err)+')';
}
if(window.google&&google.script&&google.script.run){
  google.script.run.withSuccessHandler(start).withFailureHandler(fail).getData();
}else{ fail('Apps Script 웹앱으로 배포한 주소에서 열어 주세요.'); }

/* ── 화면 한글 키보드 (키오스크용) ──
   입력칸의 글자를 자모로 풀고, 누른 자모를 더한 뒤 다시 조합해서 넣음 */
const HG={
  CHO:'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',
  JUNG:'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',
  JONG:' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ',
  V2:{'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'},
  C2:{'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}
};
HG.V2r={}; for(const k in HG.V2) HG.V2r[HG.V2[k]]=k;
HG.C2r={}; for(const k in HG.C2) HG.C2r[HG.C2[k]]=k;
const isV=j=>HG.JUNG.includes(j), isC=j=>HG.CHO.includes(j)||HG.C2r[j];
function hgDecompose(str){ // 글자 → 낱자 목록 (겹모음·겹받침도 낱자로)
  const out=[];
  for(const ch of str){ const c=ch.charCodeAt(0)-0xAC00;
    if(c>=0&&c<11172){ const cho=HG.CHO[Math.floor(c/588)], jung=HG.JUNG[Math.floor(c%588/28)], jong=HG.JONG[c%28];
      out.push(cho); out.push(...(HG.V2r[jung]||jung).split(''));
      if(jong!==' ') out.push(...(HG.C2r[jong]||jong).split('')); }
    else if(HG.V2r[ch]) out.push(...HG.V2r[ch].split(''));
    else if(HG.C2r[ch]) out.push(...HG.C2r[ch].split(''));
    else out.push(ch);
  }
  return out;
}
function hgCompose(jamo){ // 낱자 목록 → 완성된 글자
  let out='', s=null;
  const flush=()=>{ if(!s) return;
    if(s.cho&&s.jung) out+=String.fromCharCode(0xAC00+HG.CHO.indexOf(s.cho)*588+HG.JUNG.indexOf(s.jung)*28+(s.jong?HG.JONG.indexOf(s.jong):0));
    else out+=(s.cho||'')+(s.jung||'');
    s=null; };
  for(const j of jamo){
    if(isV(j)){
      if(s&&s.cho&&!s.jung) s.jung=j;
      else if(s&&s.jung&&!s.jong&&HG.V2[s.jung+j]) s.jung=HG.V2[s.jung+j];
      else if(s&&s.jong){ // 받침 하나를 다음 글자 첫소리로 넘김
        const pair=HG.C2r[s.jong]; let move;
        if(pair){ s.jong=pair[0]; move=pair[1]; } else { move=s.jong; s.jong=null; }
        flush(); s={cho:move,jung:j};
      } else { flush(); s={jung:j}; }
    } else if(HG.CHO.includes(j)){
      if(s&&s.cho&&s.jung&&!s.jong&&HG.JONG.includes(j)) s.jong=j;
      else if(s&&s.jong&&HG.C2[s.jong+j]) s.jong=HG.C2[s.jong+j];
      else { flush(); s={cho:j}; }
    } else { flush(); out+=j; }
  }
  flush(); return out;
}
const KB_ROWS=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']];
const KB_SHIFT={'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};
let kbShift=false;
function kbRender(){
  const K=$('kbd'); K.innerHTML='';
  KB_ROWS.forEach((row,ri)=>{ const r=document.createElement('div'); r.className='kbrow r'+ri;
    row.forEach(k=>{ const b=document.createElement('button'); b.type='button';
      const v=kbShift&&KB_SHIFT[k]?KB_SHIFT[k]:k; b.textContent=v; b.dataset.k=v;
      if(k==='⇧'){ b.className='fn'+(kbShift?' on':''); b.setAttribute('aria-label','쌍자음'); b.setAttribute('aria-pressed',kbShift); }
      if(k==='⌫'){ b.className='fn'; b.setAttribute('aria-label','한 글자 지우기'); }
      r.appendChild(b); });
    K.appendChild(r); });
  const r=document.createElement('div'); r.className='kbrow r3';
  [['전체 지우기','clear'],['띄어쓰기','space'],['찾기','go']].forEach(([t,k])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; b.dataset.k=k; b.className='fn '+k; r.appendChild(b); });
  K.appendChild(r);
}
function kbPress(k){
  if(k==='⇧'){ kbShift=!kbShift; kbRender(); return; }
  if(k==='go'){ tform.requestSubmit?tform.requestSubmit():tform.dispatchEvent(new Event('submit',{cancelable:true})); return; }
  if(k==='clear'){ tq.value=''; return; }
  const jamo=hgDecompose(tq.value);
  if(k==='⌫') jamo.pop(); else if(k==='space') jamo.push(' '); else jamo.push(k);
  tq.value=hgCompose(jamo);
  if(kbShift&&k!=='⌫'){ kbShift=false; kbRender(); }
}
function kbShow(on){
  $('kbd').hidden=!on; $('kbToggle').setAttribute('aria-expanded',on);
  $('kbToggle').textContent=on?'화면 키보드 닫기':'⌨ 화면 키보드';
  tq.readOnly=on; tq.setAttribute('inputmode',on?'none':'text'); // 키보드를 쓰는 동안 기기 자판이 뜨지 않게
}
$('kbd').addEventListener('pointerdown',e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); kbPress(b.dataset.k); });
$('kbd').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const b=e.target.closest('button'); if(b){ e.preventDefault(); kbPress(b.dataset.k); } } });
$('kbToggle').addEventListener('click',()=>kbShow($('kbd').hidden));
kbRender();
kbShow(String(window.KIOSK||'')==='1');
</script>
